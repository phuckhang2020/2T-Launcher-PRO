name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package public launcher files
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH (for example, v1.0.0)."
          }
          $stage = Join-Path $env:RUNNER_TEMP "2T-Launcher-PRO"
          $archive = Join-Path $env:RUNNER_TEMP "2T-Launcher-PRO-$env:GITHUB_REF_NAME.zip"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -Path "2T Launcher PRO.ahk", "Lib", "README.md", "CHANGELOG.md", "LICENSE" -Destination $stage -Recurse
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $archive
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:ARCHIVE_PATH" `
            --title "2T Launcher PRO $env:GITHUB_REF_NAME" `
            --generate-notes
